spring:
  application:
    name: winkelshop
  datasource:
    url: jdbc:h2:mem:winkelshop;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  docker:
    compose:
      enabled: false

h2:
  console:
    enabled: true
